<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day9</title>
</head>

<body>

    <script>
        const products = [
            { id: 1, name: "Laptop", price: 60000 },
            { id: 2, name: "Mouse", price: 800 },
            { id: 3, name: "Keyboard", price: 1500 },
            { id: 4, name: "Monitor", price: 12000 }
        ];

        const product = products.find(product => product.id === 3);
        console.log(product);

        const product2 = products.find(product2 => product2.price > 1000);
        console.log(product2);

        const index = products.findIndex(product => product.id === 4);
        console.log(index);

        const index2 = products.findIndex(product2 => product2.price === 800);
        console.log(index2);

        const IncludeProducts = products.includes({
            id: 2,
            name: "Mouse",
            price: 800
        });
        console.log(IncludeProducts);

        const categories = [
            "Food",
            "Travel",
            "Shopping",
            "Entertainment"
        ];

        const includeCategories = categories.includes("Travel");
        console.log(includeCategories);

        const includeCategories2 = categories.includes("Education");
        console.log(includeCategories2);

        const selectedCategory = "Shopping";

        const isValidCategory =
            categories.includes(selectedCategory);

        console.log(isValidCategory);

        const no = [10, 20, 30, 40, 50];
        console.log(no.slice(1, 4));
        const newNo = [
            ...no.slice(0, 2),
            ...no.slice(4)
        ];

        console.log(newNo);
        console.log(no);


        const products2 = [
            "Laptop",
            "Mouse",
            "Keyboard",
            "Monitor",
            "Phone"
        ];

        products2.splice(2, 1);
        console.log(products2);

        products2.splice(1, 0, "Headphones");
        console.log(products2);

        products2.splice(4, 1, "Tablet");
        console.log(products2);


        //Mutation vs Non- Mutation

        const numbers = [10, 20, 30];
        numbers.push(40);
        console.log(numbers);


        const expenses = [
            { title: "Lunch", amount: 200 },
            { title: "Uber", amount: 150 },
            { title: "Movie", amount: 300 }
        ];

        const updatedExpenses = [
            ...expenses.slice(0, 1),
            { title: "Shopping", amount: 500 },
            ...expenses.slice(1)
        ];
        console.log(updatedExpenses);
        console.log(expenses);



        //
        function getHighestExpense(expenses) {
            // highest expense return karo

            return expenses.reduce((highest, expense) => expense.amount > highest.amount ? expense : highest, expenses[0]);
        }

        function getExpensesAbove(expenses, amount) {
            // given amount se bade expenses return karo
            return expenses.filter(expense => expense.amount > amount);

        }

        getHighestExpense(expenses);
        getExpensesAbove(expenses, 500);


        //
        const expenses2 = [
            { title: "Lunch", amount: 200, category: "Food" },
            { title: "Uber", amount: 150, category: "Travel" },
            { title: "Laptop", amount: 60000, category: "Shopping" },
            { title: "Movie", amount: 300, category: "Entertainment" },
            { title: "Dinner", amount: 500, category: "Food" }
        ];


        // 1. Expenses greater than ₹300

        const above300 = expenses2.filter(
            expense => expense.amount > 300
        );

        console.log("Above ₹300:");
        console.log(above300);


        // 2. Highest → Lowest

        const sortedExpenses = [...expenses2].sort(
            (a, b) => b.amount - a.amount
        );

        console.log("Highest → Lowest:");
        console.log(sortedExpenses);


        // 3. Total expenses

        const total = expenses.reduce(
            (sum, expense) => sum + expense.amount,
            0
        );

        console.log("Total:", total);


        // 4. Find Laptop

        const laptop = expenses.find(
            expense => expense.title === "Laptop"
        );

        console.log("Laptop:");
        console.log(laptop);


        // Bonus — Get only titles

        function getExpenseTitles(expenses) {

            return expenses.map(
                expense => expense.title
            );

        }

        console.log(
            "Titles:",
            getExpenseTitles(expenses)
        );
    </script>
</body>

</html>
