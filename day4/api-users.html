<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            Users Dashboard
        </h1>

        <!-- loading state -->

        <div id="usersContainer" class="row g-4 text-center">
            <p id="loadingMessage" class="text-muted"></p>
        </div>

        <br>
        <br>

        <button id="loadBtn" class="btn btn-primary mb-4">
            Load Users
        </button>


    </div>

    <script>
        const loadBtn = document.getElementById("loadBtn");

        const usersContainer =
            document.getElementById("usersContainer");

        const loadingMessage =
            document.getElementById("loadingMessage");

        async function loadUsers() {
            try {

                loadingMessage.textContent = "⏳ Loading users...";

                const response =
                    await fetch("https://jsonplaceholder.typicode.com/users");


                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                const users = await response.json();

                loadingMessage.textContent = "";

                const usersHTML = users.map(user => `
                    <div class="col-md-4">

                         <div class="card h-100 shadow-sm p-3">

                        <h3>${user.name}</h3>

                        <p class="text-muted">
                        @${user.username}
                        </p>

                        <p>
                        📧 ${user.email}
                        </p>

                        <p>
                        📞 ${user.phone}
                        </p>

                        </div>

                    </div>
                `).join("");

                usersContainer.innerHTML = usersHTML;

            } catch (error) {
                loadingMessage.textContent =
                    "❌ Failed to load users.";
            }
        }

        // load btn - function call


        loadBtn.addEventListener("click", () => {
            loadUsers();

        });



    </script>

</body>

</html>
