<body>
    <script>
        async function getUsers() {

            try {

                const response =
                    await fetch("https://jsonplaceholder.typicode.com/wrong-url");

                if (!response.ok) {
                    throw new Error("API request failed");
                }

                const data = await response.json();

                console.log(data);

            } catch (error) {

                console.log("Something went wrong:", error.message);

            }
        }

        getUsers();
