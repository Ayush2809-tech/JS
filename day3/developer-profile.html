<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Developer Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 id="developerName" class="fw-bold">
                Ayush Saxena
            </h1>

            <p id="developerRole" class="lead">
                Full Stack Developer
            </p>
        </div>

        <button id="themeBtn" class="btn btn-outline-secondary">
            🌙 Dark Mode
        </button>
        <!-- Greeting -->

        <div class="card p-4 mb-4">

            <h2>👋 Say Hello</h2>

            <div class="input-group">
                <input id="nameInput" type="text" class="form-control" placeholder="Enter your name">

                <button id="greetBtn" class="btn btn-dark">
                    Say Hello
                </button>
            </div>

            <p id="greeting" class="mt-3 fw-semibold"></p>

        </div>


        <!-- Skills -->

        <div class="card p-4 mb-4">

            <h2>🛠️ My Skills</h2>

            <button id="skillsBtn" class="btn btn-primary mb-3">
                Show Skills
            </button>

            <div id="skillsContainer"></div>

        </div>


        <!-- Projects -->

        <div class="card p-4">

            <h2>🚀 Featured Projects</h2>

            <button id="projectsBtn" class="btn btn-success mb-3">
                Show Projects
            </button>

            <div id="projectsContainer" class="row g-3"></div>

        </div>

    </div>

    <!-- ===================Script========================= -->
    <script>

        // 1. DEVELOPER DATA
        const developer = {

            name: "Ayush Saxena",
            role: "Full Stack Developer",

            skills: [
                "HTML",
                "CSS",
                "JavaScript",
                "React",
                "Django"
            ],

            projects: [

                {
                    title: "Portfolio",
                    tech: "React",
                    featured: true
                },

                {
                    title: "Admission System",
                    tech: "Django",
                    featured: true
                },

                {
                    title: "Weather App",
                    tech: "JavaScript",
                    featured: false
                }

            ]
        };



        // 2. SELECT HTML ELEMENTS
        const nameInput = document.getElementById("nameInput");

        const greetBtn = document.getElementById("greetBtn");

        const greeting = document.getElementById("greeting");

        const skillsBtn = document.getElementById("skillsBtn");

        const skillsContainer =
            document.getElementById("skillsContainer");

        const projectsBtn =
            document.getElementById("projectsBtn");

        const projectsContainer =
            document.getElementById("projectsContainer");

        // 3. GREETING FEATURE

        greetBtn.addEventListener("click", () => {
            const name = nameInput.value;

            if (name === "") {
                greeting.textContent =
                    "Please enter your name.";

            } else {
                greeting.textContent =
                    `Hello, ${name}! 👋`;

            }
        });


        // 4. SHOW SKILLS

        skillsBtn.addEventListener("click", () => {

            const skillsHTML = developer.skills
                .map(skill => `
        <span class="badge text-bg-dark me-2 mb-2">
            ${skill}
        </span>
            `)
                .join("");

            skillsContainer.innerHTML = skillsHTML;

        });

        // 5. SHOW FEATURED PROJECTS

        projectsBtn.addEventListener("click", () => {

            const featuredProjects = developer.projects
                .filter(project => project.featured)
                .map(project => `
            
            <div class="col-md-6">

                <div class="card h-100 p-3">

                    <h3>${project.title}</h3>

                    <p class="text-muted">
                        Built with ${project.tech}
                    </p>

                    <span class="badge text-bg-primary">
                        ${project.tech}
                    </span>

                </div>

            </div>

        `)
                .join("");

            projectsContainer.innerHTML = featuredProjects;

        });

        const themeBtn = document.getElementById("themeBtn");

        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("bg-dark");
            document.body.classList.toggle("text-white");

        });

    </script>

</body>

</html>
