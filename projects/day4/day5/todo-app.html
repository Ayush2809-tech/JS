<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            📝 My Todo App
        </h1>

        <!-- Add Todo -->

        <div class="input-group mb-4">

            <input id="todoInput" type="text" class="form-control" placeholder="Enter a task">

            <button id="addBtn" class="btn btn-primary">
                Add Task
            </button>
            <button id="clearBtn" class="btn btn-danger">
                Clear All
            </button>

        </div>

        <!-- Todo List -->

        <div id="todoContainer"></div>

    </div>


    <script>

        const todoInput =
            document.getElementById("todoInput");

        const addBtn =
            document.getElementById("addBtn");

        const todoContainer =
            document.getElementById("todoContainer");

        const clearBtn =
            document.getElementById("clearBtn");

        let todos = [];

        addBtn.addEventListener("click", () => {
            const task = todoInput.value.trim();

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            todos.push({
                text: task,
                completed: false
            });

            localStorage.setItem(
                "todos",
                JSON.stringify(todos)
            );

            renderTodos();
            todoInput.value = "";

        });

        // Get saved todos
        const savedTodos =
            localStorage.getItem("todos");

        if (savedTodos) {
            todos = JSON.parse(savedTodos);
        }
        renderTodos();

        function renderTodos() {

            todoContainer.innerHTML = "";

            todos.forEach((todo, index) => {

                todoContainer.innerHTML += `
        <div class="card p-3 mb-2 d-flex flex-row justify-content-between align-items-center">

            <span class="${todo.completed ? "text-decoration-line-through text-muted" : ""}">
                ${todo.text}
            </span>

            <div>

                <button
                    class="btn btn-success btn-sm me-2"
                    onclick="completeTodo(${index})">
                    ${todo.completed ? "Undo" : "Complete"}
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteTodo(${index})">
                    Delete
                </button>

            </div>

        </div>
    `;
            });
        }

        function deleteTodo(index) {

            todos.splice(index, 1);

            localStorage.setItem(
                "todos",
                JSON.stringify(todos)
            );

            renderTodos();

        }


        function completeTodo(index) {

            todos[index].completed =
                !todos[index].completed;

            localStorage.setItem(
                "todos",
                JSON.stringify(todos)
            );

            renderTodos();
        }

        clearBtn.addEventListener("click", () => {

            todos = [];

            localStorage.removeItem("todos");

            renderTodos();

        });

        todoInput.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                addBtn.click();
            }

        });

    </script>

</body>

</html>
