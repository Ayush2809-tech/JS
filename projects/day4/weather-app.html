<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <!-- HEADER -->

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                🌦️ Weather App
            </h1>

            <p class="text-muted">
                Check current weather of any city
            </p>

        </div>


        <!-- SEARCH -->

        <div class="input-group mb-4">

            <input id="cityInput" type="text" class="form-control" placeholder="Enter city name">

            <button id="searchBtn" class="btn btn-primary">
                Search
            </button>

        </div>


        <!-- MESSAGE -->

        <p id="message" class="text-center fw-semibold"></p>


        <!-- WEATHER -->

        <div id="weatherContainer" class="row justify-content-center"></div>

    </div>


    <script>

        // ---------------------------

        const cityInput =
            document.getElementById("cityInput");

        const searchBtn =
            document.getElementById("searchBtn");

        const message =
            document.getElementById("message");

        const weatherContainer =
            document.getElementById("weatherContainer");


        // ------------------------------

        async function getWeather(city) {

            try {

                // Loading message

                message.textContent =
                    "⏳ Loading weather...";

                weatherContainer.innerHTML = "";


                // ---------------------------

                const response = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`
                );


                if (!response.ok) {

                    throw new Error(
                        "City search failed"
                    );

                }


                const data =
                    await response.json();


                // City not found

                if (!data.results || data.results.length === 0) {

                    message.textContent =
                        "❌ City not found.";

                    return;

                }


                const cityData =
                    data.results[0];


                const latitude =
                    cityData.latitude;

                const longitude =
                    cityData.longitude;


                // ----------------------------

                const weatherResponse =
                    await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`
                    );


                if (!weatherResponse.ok) {

                    throw new Error(
                        "Weather data failed"
                    );

                }


                const weatherData =
                    await weatherResponse.json();


                // ---------------------------

                const current =
                    weatherData.current;


                // ---------------

                const weatherDescription =
                    getWeatherDescription(
                        current.weather_code
                    );


                // ------------------------------
                weatherContainer.innerHTML = `

                    <div class="col-md-6">

                        <div class="card shadow p-4 text-center">

                            <h2 class="fw-bold">
                                📍 ${cityData.name}
                            </h2>

                            <p class="text-muted">
                                ${cityData.country}
                            </p>

                            <div class="display-3 fw-bold mb-3">
                                ${current.temperature_2m}°C
                            </div>

                            <h4 class="mb-4">
                                ${weatherDescription}
                            </h4>

                            <div class="row">

                                <div class="col-6 mb-3">

                                    <div class="border rounded p-3">

                                        <h5>💧 Humidity</h5>

                                        <p class="mb-0 fw-bold">
                                            ${current.relative_humidity_2m}%
                                        </p>

                                    </div>

                                </div>


                                <div class="col-6 mb-3">

                                    <div class="border rounded p-3">

                                        <h5>💨 Wind</h5>

                                        <p class="mb-0 fw-bold">
                                            ${current.wind_speed_10m} km/h
                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                `;


                message.textContent = "";


            } catch (error) {

                message.textContent =
                    "❌ Unable to load weather.";

                console.log(
                    "Error:",
                    error.message
                );

            }

        }


        // ---------------------------------------

        function getWeatherDescription(code) {

            if (code === 0) {
                return "☀️ Clear Sky";
            }

            if (code === 1 || code === 2) {
                return "🌤️ Partly Cloudy";
            }

            if (code === 3) {
                return "☁️ Overcast";
            }

            if (code >= 51 && code <= 67) {
                return "🌧️ Rain";
            }

            if (code >= 71 && code <= 77) {
                return "❄️ Snow";
            }

            if (code >= 80 && code <= 82) {
                return "🌦️ Rain Showers";
            }

            if (code >= 95) {
                return "⛈️ Thunderstorm";
            }

            return "🌡️ Weather Data";

        }


        // -----------------------------------

        searchBtn.addEventListener(
            "click",
            () => {

                const city =
                    cityInput.value.trim();


                if (city === "") {

                    message.textContent =
                        "⚠️ Please enter a city name.";

                    weatherContainer.innerHTML = "";

                    return;

                }


                getWeather(city);

            }
        );


        //----------------------------------

        cityInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    searchBtn.click();

                }

            }
        );

    </script>

</body>

</html>
